<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12131b"><title>Telop Studio — テロップメーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@900&family=Dela+Gothic+One&family=RocknRoll+One&family=M+PLUS+Rounded+1c:wght@800&family=Shippori+Mincho+B1:wght@800&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><link rel="stylesheet" href="style.css"><script type="module" src="js/main.js"></script><script>if(location.protocol==='file:')addEventListener('DOMContentLoaded',()=>{const notice=document.createElement('div');notice.textContent='このアプリはGitHub PagesまたはローカルHTTPサーバーで開いてください。起動方法は「使い方」にあります。';notice.style.cssText='position:fixed;inset:0 0 auto;padding:24px;background:#ffe2a6;color:#251a0a;z-index:99';document.body.append(notice);});</script></head>
<body><header class="topbar"><div class="brand"><b class="logo">T<span>↗</span></b><div><strong>TELOP <em>STUDIO</em></strong><small>言葉に、存在感を。</small></div></div><div class="project-tools"><select id="projects" aria-label="プロジェクト"></select><button id="newProject" title="新規プロジェクト">＋ 新規</button><button id="renameProject">名前変更</button><span id="saveState" role="status">保存済み</span></div><div class="header-actions"><button id="undo" title="元に戻す Ctrl+Z">↶</button><button id="redo" title="やり直す Ctrl+Shift+Z">↷</button><button id="historyButton">履歴</button><button id="jsonExport">JSON保存</button><button id="jsonImport">読込</button><a href="manual.html" target="_blank">使い方 ↗</a><button id="zip" class="primary">全件ZIP ↓</button></div></header>
<main class="workspace"><aside class="panel script-panel"><div class="panel-heading"><div><span class="eyebrow">01 / SCRIPT</span><h1>台本</h1></div><span id="rowCount" class="pill">0 CUTS</span></div><details class="bulk"><summary>台本をまとめて貼り付ける</summary><textarea id="script" rows="7" aria-label="一括台本入力">! 知ってた？ 日本のひみつ

A: たった3つのヒントで
場所がわかる？

B: えっ、まさかの100万円！？

N: 『地形』に注目してみよう

※ 答えは動画の最後に</textarea><p class="hint">空行で次のカードへ。通常の改行は画像内改行。</p><button id="importScript">カードに追加</button></details><div class="list-tools"><button id="addRow">＋ テロップ追加</button><button id="selectAll">全選択</button></div><div id="cards" class="cards"></div><div class="panel-footer"><span class="dot"></span> 台本はこのブラウザに保存されます</div></aside>
<section class="panel center-panel"><div class="panel-heading"><div><span class="eyebrow">02 / CANVAS</span><h2>プレビュー</h2></div><span id="currentLabel" class="pill">CUT 01</span></div><div class="preview-controls"><div class="segments" aria-label="プレビュー背景"><button data-bg="checker" class="active">透過</button><button data-bg="black">黒</button><button data-bg="scene">映像風</button></div><span id="dimensions">フォント準備中…</span></div><div id="preview" class="preview checker"><span id="emptyHint">文字を入力すると、ここに表示されます</span></div><p class="preview-caption"><span>TRANSPARENT PNG</span><span>自動トリミング · 余白12px</span></p><div class="editor-box"><div class="editor-label"><label for="editor">選択中のテロップ</label><span id="selectionLabel">文字をドラッグして部分装飾</span></div><textarea id="editor" rows="3" placeholder="ここから文字を入力できます" maxlength="5000"></textarea><div id="quickbar" class="quickbar"><button data-quick="large">大きく</button><button data-quick="red"><i class="swatch red"></i>赤</button><button data-quick="yellow"><i class="swatch yellow"></i>黄</button><button data-quick="blue"><i class="swatch blue"></i>青</button><button data-quick="clear">強調解除</button><button data-quick="inherit">役割に戻す</button></div></div><div class="export-actions"><button id="copy" class="primary">▣ この画像をコピー</button><button id="png">PNG保存 ↓</button></div><div class="gallery-heading"><h3>すべてのテロップ</h3><span id="galleryCount"></span></div><div id="gallery" class="gallery"></div></section>
<aside class="panel settings-panel"><div class="panel-heading"><div><span class="eyebrow">03 / DESIGN</span><h2>デザイン</h2></div><span class="spark">✦</span></div><section class="set-panel"><label for="designSet">デザインセット</label><div class="inline"><select id="designSet"></select><button id="applySet" class="accent">適用</button></div><div class="inline"><select id="setTarget" aria-label="セットの適用先"><option value="current">現在のカード</option><option value="selected">チェックしたカード</option><option value="all">すべてのカード</option></select></div><label class="check"><input type="checkbox" id="keepMarks" checked> 部分装飾を残す</label><button id="saveSet" class="wide">＋ 現在の5役割をマイセットに保存</button><div class="inline"><button id="exportSets">マイセット書出</button><button id="importSets">読込</button></div></section><section class="target-panel"><label for="scope">編集対象</label><select id="scope"><option value="row">現在のカード全体</option><option value="selection">選択した文字</option><option value="role">役割の共通設定</option></select><div id="roleTabs" class="role-tabs"></div><p id="targetHint" class="hint"></p></section><form id="settings" onsubmit="return false"></form><button id="resetStyle" class="wide reset">編集対象を初期値に戻す</button></aside></main>
<dialog id="historyDialog"><div class="dialog-head"><h2>操作履歴</h2><button data-close="historyDialog">閉じる ×</button></div><p class="hint">直近50操作。保存状態は残りますが、履歴は再読み込みで消えます。</p><div id="historyList"></div></dialog>
<dialog id="nameDialog"><form method="dialog"><h2 id="nameTitle">名前</h2><input id="nameValue" maxlength="80" required autocomplete="off"><div class="dialog-actions"><button value="cancel" formnovalidate>キャンセル</button><button value="ok" class="primary">保存</button></div></form></dialog><input id="jsonFile" type="file" accept=".json,application/json" hidden><div id="toast" role="status" aria-live="polite"></div><noscript>JavaScriptを有効にして開いてください。</noscript></body></html>
